<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B2B2C</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "system-ui", "sans-serif"],
              mono: ['"JetBrains Mono"', "monospace"],
            },
            colors: {
              // Palet hijau emerald untuk B2B2C
              brand: {
                50: "#ecfdf5",
                100: "#d1fae5",
                200: "#a7f3d0",
                300: "#6ee7b7",
                400: "#34d399",
                500: "#10b981",
                600: "#059669",
                700: "#047857",
                800: "#065f46",
                900: "#064e3b",
              },
              ink: {
                50: "#f6f7f9",
                100: "#eceef2",
                200: "#d5dae2",
                300: "#b0bac9",
                400: "#8593a8",
                500: "#66748c",
                600: "#515d72",
                700: "#434c5e",
                800: "#3a4150",
                900: "#343a45",
              },
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --page-bg: #f4f6fb;
      }

      body {
        background-color: var(--page-bg);
        background-image:
          radial-gradient(circle at 12% 8%, rgba(16, 185, 129, 0.12), transparent 45%),
          radial-gradient(circle at 92% 4%, rgba(5, 150, 105, 0.12), transparent 45%),
          radial-gradient(circle at 78% 96%, rgba(52, 211, 153, 0.08), transparent 50%);
        background-attachment: fixed;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image: radial-gradient(rgba(6, 95, 70, 0.05) 1px, transparent 1px);
        background-size: 22px 22px;
        mask-image: radial-gradient(circle at 50% 30%, #000 55%, transparent 100%);
        -webkit-mask-image: radial-gradient(circle at 50% 30%, #000 55%, transparent 100%);
      }

      .surface {
        position: relative;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          0 1px 2px rgba(6, 95, 70, 0.04),
          0 12px 30px -14px rgba(6, 95, 70, 0.18);
      }

      .field {
        background: #ffffff;
        border: 1.5px solid #e3e8f0;
        color: #26303f;
        transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
      }
      .field::placeholder {
        color: #8a97ab;
      }
      .field:hover {
        border-color: #cdd7e6;
      }
      .field:focus {
        border-color: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        outline: none;
        background: #fff;
      }

      .reveal {
        opacity: 0;
        transform: translate3d(0, 18px, 0);
        transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .reveal.in {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      .icon-badge {
        display: grid;
        place-items: center;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 0.85rem;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      }

      .back-link {
        transition: transform 0.2s ease;
      }
      .back-link:hover {
        transform: translateX(-3px);
      }

      @media print {
        body {
          background: #fff !important;
        }
        body::before,
        header,
        .no-print {
          display: none !important;
        }
        .surface {
          box-shadow: none !important;
          border: 1px solid #e5e7eb !important;
        }
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body class="min-h-screen text-ink-800 font-sans antialiased selection:bg-brand-200/60">
    <!-- Sticky top bar -->
    <header class="sticky top-0 z-[60] backdrop-blur-md bg-white/70 border-b border-white/60">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <button
            id="btn-back"
            class="back-link flex items-center gap-1.5 text-ink-500 hover:text-ink-800 text-sm font-semibold mr-3 pr-3 border-r border-ink-200"
          >
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
          </button>
          <span class="icon-badge bg-brand-500/12 text-brand-600 !w-9 !h-9" aria-hidden="true">
            <i data-lucide="shield-check" class="w-5 h-5"></i>
          </span>
          <span class="font-extrabold tracking-tight text-ink-900"
            >Simulasi<span class="text-brand-600">.</span>Desk</span
          >
        </div>
        <span
          id="breadcrumb-pill"
          class="shrink-0 inline-flex items-center gap-2 text-xs font-semibold bg-white border border-ink-200 text-ink-700 px-4 py-2 rounded-full shadow-sm"
        >
          <i data-lucide="handshake" class="w-4 h-4 text-brand-600" aria-hidden="true"></i>
          Added Value
        </span>
      </div>
    </header>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.lucide && typeof lucide.createIcons === "function") {
          lucide.createIcons();
        }
        const btnBack = document.getElementById("btn-back");
        if (btnBack) {
          btnBack.addEventListener("click", () => {
            window.location.href = "../index.html";
          });
        }
      });
    </script>
  </body>
</html>
